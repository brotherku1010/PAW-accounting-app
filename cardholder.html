<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#12121a">
    <link rel="manifest" href="cardholder-manifest.json">
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <title>信用卡附卡明細</title>
    <style>
        :root { color-scheme: dark; --bg:#12121a; --card:#20202c; --line:rgba(255,255,255,.1); --muted:#aeb1bd; --accent:#d6a5ff; }
        * { box-sizing:border-box; }
        body { margin:0; min-height:100vh; color:#fff; background:var(--bg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif; }
        main { width:min(100%, 760px); margin:0 auto; padding:24px 16px 48px; }
        h1 { margin:0; font-size:25px; }
        .sub { margin:6px 0 22px; color:var(--muted); font-size:14px; }
        .controls, .summary, .table-card { background:rgba(32,32,44,.84); border:1px solid var(--line); border-radius:18px; box-shadow:0 8px 28px rgba(0,0,0,.18); }
        .controls { display:grid; grid-template-columns:1fr 1fr auto; gap:12px; align-items:end; padding:16px; margin-bottom:16px; }
        label { display:block; font-size:13px; color:var(--muted); margin-bottom:6px; }
        select, button { width:100%; border-radius:10px; min-height:42px; font:inherit; }
        select { background:#14141d; color:#fff; border:1px solid var(--line); padding:0 10px; }
        button { border:0; cursor:pointer; padding:0 16px; background:linear-gradient(135deg,#a158e8,#7139b7); color:#fff; font-weight:700; white-space:nowrap; }
        button:disabled { opacity:.6; cursor:wait; }
        .summary { display:grid; grid-template-columns:repeat(3, 1fr); gap:0; padding:0; margin-bottom:16px; overflow:hidden; }
        .summary-item { padding:17px 18px; }
        .summary-item + .summary-item { border-left:1px solid var(--line); }
        .summary-label { color:var(--muted); font-size:13px; }
        .summary-value { font-size:31px; font-weight:700; font-family:monospace; margin-top:4px; color:var(--accent); }
        .summary-note { color:var(--muted); font-size:13px; margin-top:3px; }
        .table-card { overflow-x:auto; }
        table { width:100%; min-width:600px; border-collapse:collapse; font-size:14px; }
        th, td { padding:13px 14px; text-align:left; border-bottom:1px solid var(--line); vertical-align:top; }
        th { color:var(--muted); font-size:12px; font-weight:500; white-space:nowrap; }
        tr:last-child td { border-bottom:0; }
        td { word-break:break-word; }
        #app-lock { position:fixed; inset:0; z-index:10; display:flex; align-items:center; justify-content:center; padding:20px; background:var(--bg); }
        #app-lock .lock-card { width:min(100%,360px); padding:26px; border:1px solid var(--line); border-radius:18px; background:var(--card); text-align:center; }
        #app-lock h2 { margin:0 0 8px; font-size:22px; }
        #app-lock p { margin:0 0 20px; color:var(--muted); font-size:14px; }
        #app-lock input { width:100%; height:46px; border:1px solid var(--line); border-radius:10px; background:#14141d; color:#fff; padding:0 12px; text-align:center; letter-spacing:4px; font-size:20px; margin-bottom:12px; }
        #lock-error { min-height:20px; margin:10px 0 0; color:#ff9999; font-size:13px; }
        .header-actions { display:flex; align-items:center; gap:8px; }
        .logout, .notify { width:auto; min-height:32px; padding:0 10px; background:transparent; border:1px solid var(--line); color:var(--muted); font-size:12px; }
        .notify.is-enabled { border-color:rgba(214,165,255,.72); background:rgba(214,165,255,.13); color:#f1ddff; }
        .notify:disabled { cursor:wait; }
        .notification-note { margin:-9px 2px 18px; color:var(--muted); font-size:12px; line-height:1.55; }
        .message { padding:36px 16px; color:var(--muted); text-align:center; }
        .error { color:#ff9999; }
        @media (max-width:480px) { main { padding:20px 12px 40px; } .controls { grid-template-columns:1fr 1fr; } .controls button { grid-column:1 / -1; } .summary { grid-template-columns:1fr; } .summary-item + .summary-item { border-left:0; border-top:1px solid var(--line); } }
    </style>
</head>

<body>
    <main>
        <div style="display:flex; justify-content:space-between; align-items:center; gap:12px;">
            <h1>信用卡附卡明細</h1>
            <div class="header-actions">
                <button id="cardholder-push-button" class="notify" type="button" onclick="toggleCardholderReminder()" disabled>載入提醒設定…</button>
                <button class="logout" type="button" onclick="lockApp()">登出</button>
            </div>
        </div>
        <p class="sub">可查看指定帳單期的使用明細，並切換要查看的年份與月份。</p>
        <p id="cardholder-push-note" class="notification-note">附卡繳費提醒會在每月 10、11、12 日各推播一次，提醒 13 日繳付前一期帳單。</p>

        <section class="controls" aria-label="年月選擇">
            <div><label for="selected-year">選擇年份</label><select id="selected-year"></select></div>
            <div><label for="selected-month">選擇月份</label><select id="selected-month"></select></div>
            <button id="apply-button" onclick="applyOptions()">套用</button>
        </section>

        <section id="summary" class="summary">
            <div class="summary-item"><div class="summary-label">本月刷卡總額度</div><div class="summary-value">—</div></div>
            <div class="summary-item"><div class="summary-label">本月已繳金額</div><div class="summary-value">—</div></div>
            <div class="summary-item"><div class="summary-label">本月待繳金額</div><div class="summary-value">—</div></div>
        </section>
        <section class="table-card"><div id="details" class="message">正在載入附卡明細...</div></section>
    </main>
    <div id="app-lock">
        <div class="lock-card">
            <h2>PAW 附卡額度</h2>
            <p>請輸入進入密碼後查看消費金額。</p>
            <input id="app-password" type="password" inputmode="numeric" autocomplete="current-password" maxlength="12" aria-label="進入密碼">
            <button onclick="unlockApp()">進入</button>
            <div id="lock-error" role="alert"></div>
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbxe7e6g3TOC0mPoQZPIKabS10IHBCdkIIZUQ_ykjRluoQPHoLwPcwlHEmYYIreFD09fRQ/exec';
        const yearSelect = document.getElementById('selected-year');
        const monthSelect = document.getElementById('selected-month');
        const applyButton = document.getElementById('apply-button');
        const APP_PASSWORD = '1973';
        const ONESIGNAL_APP_ID = '63edf55e-d6fa-4954-a990-e83ff5675d51';
        const CARDHOLDER_REMINDER_TAG = 'paw_cardholder_payment_reminder';
        const ONESIGNAL_WORKER_PATH = 'OneSignalSDK-v16-ServiceWorker/OneSignalSDK-v16-ServiceWorker/OneSignalSDKWorker.js';
        const ONESIGNAL_WORKER_SCOPE = './OneSignalSDK-v16-ServiceWorker/OneSignalSDK-v16-ServiceWorker/';
        let oneSignalInstance = null;
        let oneSignalInitError = '';
        const oneSignalReady = new Promise(resolve => {
            window.OneSignalDeferred = window.OneSignalDeferred || [];
            window.OneSignalDeferred.push(async function (OneSignal) {
                try {
                    await OneSignal.init({
                        appId: ONESIGNAL_APP_ID,
                        notifyButton: { enable: false },
                        serviceWorkerPath: ONESIGNAL_WORKER_PATH,
                        serviceWorkerParam: { scope: ONESIGNAL_WORKER_SCOPE }
                    });
                    oneSignalInstance = OneSignal;
                    OneSignal.User.PushSubscription.addEventListener('change', refreshCardholderReminderUI);
                } catch (error) {
                    oneSignalInitError = error && error.message ? error.message : '推播服務無法初始化';
                    console.warn('附卡提醒初始化失敗：', error);
                }
                resolve(oneSignalInstance);
            });
        });

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>'"]/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' })[char]);
        }

        function toAmount(value) {
            const amount = Number(String(value ?? '').replace(/[^0-9.-]/g, ''));
            return Number.isFinite(amount) ? amount : 0;
        }

        function setOptions(year, month) {
            const currentYear = new Date().getFullYear();
            const selectedYear = Number(year) || currentYear;
            const startYear = Math.min(2020, selectedYear);
            const endYear = Math.max(currentYear + 5, selectedYear + 1);
            yearSelect.innerHTML = Array.from({ length:endYear - startYear + 1 }, (_, index) => {
                const value = startYear + index;
                return `<option value="${value}" ${value === selectedYear ? 'selected' : ''}>${value} 年</option>`;
            }).join('');
            monthSelect.innerHTML = Array.from({ length:12 }, (_, index) => {
                const value = index + 1;
                return `<option value="${value}" ${value === Number(month) ? 'selected' : ''}>${value} 月</option>`;
            }).join('');
        }

        function renderDetails(result) {
            const details = document.getElementById('details');
            const summary = document.getElementById('summary');
            const headers = (result.headers || []).map((header, index) => ({ header:String(header).trim(), index })).filter(item => item.header);
            const rows = result.data || [];
            const summaryLabels = ['本月刷卡總額度', '本月已繳金額', '本月待繳金額'];
            const summaryValues = summaryLabels.map(label => {
                const column = headers.find(item => item.header === label);
                const row = column ? rows.find(item => String(item[column.index] ?? '').trim() !== '') : null;
                return toAmount(row && column ? row[column.index] : 0);
            });
            const detailHeaders = headers.filter(item => ![...summaryLabels, '上月未繳'].includes(item.header));
            summary.innerHTML = `
                <div class="summary-item">
                    <div class="summary-label">本月刷卡總額度</div>
                    <div class="summary-value">$ ${summaryValues[0].toLocaleString('zh-TW')}</div>
                    <div class="summary-note">${escapeHtml(result.options.year)} 年 ${escapeHtml(result.options.month)} 月</div>
                </div>
                <div class="summary-item">
                    <div class="summary-label">本月已繳金額</div>
                    <div class="summary-value">$ ${summaryValues[1].toLocaleString('zh-TW')}</div>
                    <div class="summary-note">${escapeHtml(result.options.year)} 年 ${escapeHtml(result.options.month)} 月</div>
                </div>
                <div class="summary-item">
                    <div class="summary-label">本月待繳金額</div>
                    <div class="summary-value">$ ${summaryValues[2].toLocaleString('zh-TW')}</div>
                    <div class="summary-note">${escapeHtml(result.options.year)} 年 ${escapeHtml(result.options.month)} 月</div>
                </div>`;

            if (!rows.length) {
                details.className = 'message';
                details.textContent = '這個月份尚無附卡消費明細。';
                return;
            }
            details.className = '';
            details.innerHTML = `<table><thead><tr>${detailHeaders.map(item => `<th>${escapeHtml(item.header)}</th>`).join('')}</tr></thead><tbody>${rows.map(row => `<tr>${detailHeaders.map(item => `<td>${escapeHtml(row[item.index])}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
        }

        async function loadDetails() {
            const details = document.getElementById('details');
            details.className = 'message';
            details.textContent = '正在載入附卡明細...';
            try {
                const response = await fetch(`${API_URL}?action=getSupplementaryCardDetails`);
                const result = await response.json();
                if (!result.success) throw new Error(result.message || '讀取失敗');
                setOptions(result.options.year, result.options.month);
                renderDetails(result);
            } catch (error) {
                details.className = 'message error';
                details.textContent = `無法載入資料：${error.message}`;
            }
        }

        async function applyOptions() {
            applyButton.disabled = true;
            applyButton.textContent = '更新中...';
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action:'updateSupplementaryCardOptions', year:Number(yearSelect.value), month:Number(monthSelect.value) })
                });
                const result = await response.json();
                if (!result.success) throw new Error(result.message || '更新失敗');
                await loadDetails();
            } catch (error) {
                const details = document.getElementById('details');
                details.className = 'message error';
                details.textContent = `無法更新年月：${error.message}`;
            } finally {
                applyButton.disabled = false;
                applyButton.textContent = '套用';
            }
        }

        function setCardholderReminderUI({ enabled = false, supported = true, message = '' } = {}) {
            const button = document.getElementById('cardholder-push-button');
            const note = document.getElementById('cardholder-push-note');
            button.classList.toggle('is-enabled', enabled);
            button.disabled = !supported;
            button.textContent = enabled ? '繳費提醒：已開啟' : (supported ? '開啟繳費提醒' : '此裝置不支援推播');
            note.textContent = message || (enabled
                ? '已開啟：每月 10、11、12 日各提醒一次，13 日繳付前一期帳單。'
                : '附卡繳費提醒會在每月 10、11、12 日各推播一次，提醒 13 日繳付前一期帳單。');
        }

        async function refreshCardholderReminderUI() {
            const OneSignal = await oneSignalReady;
            if (!OneSignal) {
                setCardholderReminderUI({ supported: false, message: `推播服務目前無法使用${oneSignalInitError ? `：${oneSignalInitError}` : ''}` });
                return;
            }
            const supported = OneSignal.Notifications.isPushSupported();
            if (!supported) {
                setCardholderReminderUI({ supported: false, message: '此瀏覽器或目前的使用模式不支援推播通知。' });
                return;
            }
            const tags = OneSignal.User.getTags() || {};
            const enabled = Boolean(OneSignal.User.PushSubscription.optedIn && tags[CARDHOLDER_REMINDER_TAG] === 'enabled');
            setCardholderReminderUI({ enabled });
        }

        async function toggleCardholderReminder() {
            const button = document.getElementById('cardholder-push-button');
            button.disabled = true;
            try {
                const OneSignal = await oneSignalReady;
                if (!OneSignal || !OneSignal.Notifications.isPushSupported()) throw new Error('此裝置不支援推播通知');

                const tags = OneSignal.User.getTags() || {};
                const isEnabled = Boolean(OneSignal.User.PushSubscription.optedIn && tags[CARDHOLDER_REMINDER_TAG] === 'enabled');
                if (isEnabled) {
                    await OneSignal.User.removeTag(CARDHOLDER_REMINDER_TAG);
                } else {
                    if (!OneSignal.User.PushSubscription.optedIn) await OneSignal.User.PushSubscription.optIn();
                    if (!OneSignal.User.PushSubscription.optedIn) throw new Error('尚未取得通知權限，請在瀏覽器提示中選擇允許');
                    await OneSignal.User.addTag(CARDHOLDER_REMINDER_TAG, 'enabled');
                }
            } catch (error) {
                setCardholderReminderUI({
                    supported: true,
                    message: `無法變更提醒設定：${error && error.message ? error.message : '請稍後再試'}`
                });
                return;
            }
            await refreshCardholderReminderUI();
        }

        function unlockApp() {
            const input = document.getElementById('app-password');
            if (input.value !== APP_PASSWORD) {
                document.getElementById('lock-error').textContent = '密碼不正確，請再試一次。';
                input.select();
                return;
            }
            sessionStorage.setItem('paw-cardholder-unlocked', 'true');
            document.getElementById('app-lock').style.display = 'none';
            loadDetails();
            refreshCardholderReminderUI();
        }

        function lockApp() {
            sessionStorage.removeItem('paw-cardholder-unlocked');
            document.getElementById('app-password').value = '';
            document.getElementById('lock-error').textContent = '';
            document.getElementById('app-lock').style.display = 'flex';
        }

        document.getElementById('app-password').addEventListener('keydown', event => {
            if (event.key === 'Enter') unlockApp();
        });

        if (sessionStorage.getItem('paw-cardholder-unlocked') === 'true') {
            document.getElementById('app-lock').style.display = 'none';
            loadDetails();
            refreshCardholderReminderUI();
        }
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('./cardholder-sw.js');
    </script>
</body>

</html>
